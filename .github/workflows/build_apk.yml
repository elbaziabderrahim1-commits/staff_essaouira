  List<String> get workCentersList {
    Set<String> centers = {'الكل'};
    for (var emp in _employees) {
      if (emp.workCenter.isNotEmpty) centers.add(emp.workCenter);
    }
    return centers.toList();
  }

  void _showEmployeeDialog({Employee? employee}) {
    final nameController = TextEditingController(text: employee?.name ?? '');
    final adminNumController = TextEditingController(text: employee?.adminNumber ?? '');
    final workCenterController = TextEditingController(text: employee?.workCenter ?? '');
    final taskController = TextEditingController(text: employee?.task ?? '');
    final restDaysController = TextEditingController(text: employee?.restDays ?? '');

    showDialog(
      context: context,
      builder: (ctx) => Directionality(
        textDirection: TextDirection.rtl,
        child: AlertDialog(
          title: Text(employee == null ? 'إضافة موظف جديد' : 'تعديل بيانات الموظف'),
          content: SingleChildScrollView(
            child: Column(
              mainAxisSize: MainAxisSize.min,
              children: [
                TextField(
                  controller: nameController,
                  decoration: const InputDecoration(labelText: 'اسم الموظف'),
                ),
                TextField(
                  controller: adminNumController,
                  decoration: const InputDecoration(labelText: 'الرقم الإداري'),
                ),
                TextField(
                  controller: workCenterController,
                  decoration: const InputDecoration(labelText: 'مركز العمل'),
                ),
                TextField(
                  controller: taskController,
                  decoration: const InputDecoration(labelText: 'المهمة المكلف بها'),
                ),
                TextField(
                  controller: restDaysController,
                  decoration: const InputDecoration(labelText: 'أيام الراحة الأسبوعية'),
                ),
              ],
            ),
          ),
          actions: [
            TextButton(
              onPressed: () => Navigator.of(ctx).pop(),
              child: const Text('إلغاء'),
            ),
            ElevatedButton(
              style: ElevatedButton.styleFrom(backgroundColor: Colors.teal),
              onPressed: () {
                if (nameController.text.isEmpty || adminNumController.text.isEmpty) return;
                setState(() {
                  if (employee == null) {
                    _employees.add(
                      Employee(
                        id: DateTime.now().millisecondsSinceEpoch.toString(),
                        name: nameController.text,
                        adminNumber: adminNumController.text,
                        workCenter: workCenterController.text,
                        task: taskController.text,
                        restDays: restDaysController.text,
                      ),
                    );
                  } else {
                    employee.name = nameController.text;
                    employee.adminNumber = adminNumController.text;
                    employee.workCenter = workCenterController.text;
                    employee.task = taskController.text;
                    employee.restDays = restDaysController.text;
                  }
                });
                Navigator.of(ctx).pop();
              },
              child: Text(
                employee == null ? 'إضافة' : 'حفظ التعديلات',
                style: const TextStyle(color: Colors.white),
              ),
            ),
          ],
        ),
      ),
    );
  }

  void _deleteEmployee(Employee emp) {
    setState(() {
      _employees.remove(emp);
    });
  }

  @override
  Widget build(BuildContext context) {
    final filteredEmployees = _employees.where((emp) {
      final matchesSearch = emp.name.contains(_searchQuery) || emp.adminNumber.contains(_searchQuery);
      final matchesCenter = _selectedWorkCenter == 'الكل' || emp.workCenter == _selectedWorkCenter;
      final matchesRestDay = _selectedRestDay == 'الكل' || emp.restDays.contains(_selectedRestDay);
      return matchesSearch && matchesCenter && matchesRestDay;
    }).toList();

    return Scaffold(
      appBar: AppBar(
        title: Text('إدارة الموظفين (${filteredEmployees.length}/${_employees.length})'),
        backgroundColor: Colors.teal,
        foregroundColor: Colors.white,
      ),
      body: Directionality(
        textDirection: TextDirection.rtl,
        child: Column(
          children: [
            // شريط البحث
            Padding(
              padding: const EdgeInsets.symmetric(horizontal: 12.0, vertical: 8.0),
              child: TextField(
                onChanged: (value) => setState(() => _searchQuery = value),
                decoration: InputDecoration(
                  labelText: 'بحث بالاسم أو الرقم الإداري...',
                  prefixIcon: const Icon(Icons.search),
                  border: OutlineInputBorder(
                    borderRadius: BorderRadius.circular(12),
                  ),
                ),
              ),
            ),

            // فلترة حسب أيام الراحة الأسبوعية
            Container(
              height: 45,
              padding: const EdgeInsets.symmetric(horizontal: 8),
              child: ListView.builder(
                scrollDirection: Axis.horizontal,
                itemCount: restDaysFilterList.length,
                itemBuilder: (ctx, idx) {
                  final day = restDaysFilterList[idx];
                  final isSelected = _selectedRestDay == day;
                  return Padding(
                    padding: const EdgeInsets.symmetric(horizontal: 4.0),
                    child: FilterChip(
                      label: Text(day == 'الكل' ? 'كل أيام الراحة' : day),
                      selected: isSelected,
                      selectedColor: Colors.teal.shade200,
                      onSelected: (bool selected) {
                        setState(() {
                          _selectedRestDay = selected ? day : 'الكل';
                        });
                      },
                    ),
                  );
                },
              ),
            ),

            // فلترة حسب مركز العمل
            Padding(
              padding: const EdgeInsets.symmetric(horizontal: 12.0, vertical: 4.0),
              child: DropdownButtonFormField<String>(
                value: workCentersList.contains(_selectedWorkCenter) ? _selectedWorkCenter : 'الكل',
                decoration: InputDecoration(
                  labelText: 'تصفية حسب مركز العمل',
                  border: OutlineInputBorder(
                    borderRadius: BorderRadius.circular(12),
                  ),
                  contentPadding: const EdgeInsets.symmetric(horizontal: 12, vertical: 8),
                ),
                items: workCentersList
                    .map((c) => DropdownMenuItem(
                          value: c,
                          child: Text(c, style: const TextStyle(fontSize: 13)),
                        ))
                    .toList(),
                onChanged: (val) {
                  if (val != null) {
                    setState(() => _selectedWorkCenter = val);
                  }
                },
              ),
            ),

            const Divider(),

            // قائمة الموظفين
            Expanded(
              child: filteredEmployees.isEmpty
                  ? const Center(child: Text('لا يوجد موظفون مطابقون للبحث'))
                  : ListView.builder(
                      itemCount: filteredEmployees.length,
                      itemBuilder: (context, index) {
                        final emp = filteredEmployees[index];
                        return Card(
                          margin: const EdgeInsets.symmetric(horizontal: 12, vertical: 6),
                          child: ListTile(
                            onTap: () => _showEmployeeDialog(employee: emp),
                            leading: CircleAvatar(
                              backgroundColor: Colors.teal.shade100,
                              child: Text(
                                emp.name.isNotEmpty ? emp.name[0] : '؟',
                                style: const TextStyle(fontWeight: FontWeight.bold),
                              ),
                            ),
                            title: Row(
                              children: [
                                Expanded(
                                  child: Text(
                                    '${emp.name} (${emp.adminNumber})',
                                    style: const TextStyle(fontWeight: FontWeight.bold),
                                  ),
                                ),
                                IconButton(
                                  icon: const Icon(Icons.delete_outline, color: Colors.red),
                                  onPressed: () => _deleteEmployee(emp),
                                ),
                              ],
                            ),
                            subtitle: Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: [
                                const SizedBox(height: 2),
                                Text('مركز العمل: ${emp.workCenter}',
                                    style: const TextStyle(color: Colors.teal, fontWeight: FontWeight.bold)),
                                Text('المهمة: ${emp.task}'),
                                Text(
                                  'أيام الراحة: ${emp.restDays}',
                                  style: TextStyle(
                                    color: Colors.red.shade700,
                                    fontSize: 12,
                                    fontWeight: FontWeight.w600,
                                  ),
                                ),
                              ],
                            ),
                            trailing: Checkbox(
                              value: emp.isTaskCompleted,
                              onChanged: (val) {
                                setState(() {
                                  emp.isTaskCompleted = val ?? false;
                                });
                              },
                            ),
                          ),
                        );
                      },
                    ),
            ),
          ],
        ),
      ),
      floatingActionButton: FloatingActionButton(
        onPressed: () => _showEmployeeDialog(),
        backgroundColor: Colors.teal,
        child: const Icon(Icons.add, color: Colors.white),
      ),
    );
  }
}
